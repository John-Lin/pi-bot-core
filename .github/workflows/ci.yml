name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Prepare Gondolin with krun
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils libcap-ng0 libgcc-s1
          sudo chown "$(id -u)" /dev/kvm
          bun -e 'import { validateGondolinSandbox } from "pi-bot-core/gondolin"; await validateGondolinSandbox();'

      - name: Test
        env:
          PI_BOT_TEST_GONDOLIN: "1"
        run: bun test
