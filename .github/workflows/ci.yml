name: CI

on:
  push:
    branches: [main]
  # Check every pull request, including ones stacked on other pull request branches.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Lint, typecheck, workflow and repository checks are defined once in prek.toml.
      - name: Run repository hooks
        uses: j178/prek-action@v3.1.1

      # Every tests/vm-*.test.ts file runs in the vm job instead.
      - name: Test
        run: bun test --path-ignore-patterns='tests/vm-*.test.ts'

  vm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Enable KVM for the QEMU tests
        run: |
          if [ ! -c /dev/kvm ]; then
            echo "::warning::/dev/kvm is unavailable; Gondolin will use software emulation"
          else
            # Gondolin uses KVM only when the runner user can read and write the device.
            if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
              echo "Granting the runner user access to /dev/kvm"
              sudo setfacl -m "u:$(id -u):rw" /dev/kvm
            fi
            test -r /dev/kvm
            test -w /dev/kvm
            echo "The runner can use /dev/kvm"
          fi

      - name: Prepare the VM sandbox with QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils
          bun -e 'import { validateVMSandbox } from "pi-bot-core/vm-sandbox"; await validateVMSandbox();'

      # --shard deals the sorted files round-robin across shards; with four VM files each shard runs one.
      - name: Test
        env:
          PI_BOT_TEST_VM_SANDBOX: "1"
        run: bun test --shard=${{ matrix.shard }}/4 tests/vm-*.test.ts
