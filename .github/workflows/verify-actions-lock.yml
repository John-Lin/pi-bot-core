name: Verify actions lockfile

# Only workflow changes can desync actions.lock, so other changes skip the check.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Fails when actions.lock is out of sync with the workflows or a locked pin no longer verifies upstream.
      - name: Verify actions.lock
        uses: github/gh-actions-lock@verify/v0.5.1
