[[repos]]
repo = "local"

[[repos.hooks]]
id = "typecheck"
name = "TypeScript typecheck"
entry = "bun --no-env-file run typecheck"
language = "system"
stages = ["pre-commit"]
always_run = true
pass_filenames = false

[[repos.hooks]]
id = "lint"
name = "Oxlint (source files)"
# Run the package script so lint flags live only in package.json.
entry = "bun --no-env-file run lint"
language = "system"
stages = ["pre-commit"]
files = '^src/.*\.ts$'
pass_filenames = false

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-merge-conflict", args = ["--assume-in-merge"] },
  { id = "detect-private-key" },
]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [{ id = "actionlint" }]

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "v1.33.1"
hooks = [{ id = "zizmor", args = ["--offline", "--no-progress"] }]
